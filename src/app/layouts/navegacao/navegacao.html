<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-icon">
        <mat-icon>home_work</mat-icon>
      </div>
      <div class="logo-text">
        <span class="logo-title">Dev-Tech</span>
        <span class="logo-subtitle">Sistema Escolar</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Menu principal -->
    <nav class="nav-menu">
      <a routerLink="/home" routerLinkActive="active" class="nav-item">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/usuarios" routerLinkActive="active" class="nav-item">
        <mat-icon>person_outline</mat-icon>
        <span>Minha Conta</span>
      </a>
      <a routerLink="/turmas" routerLinkActive="active" class="nav-item">
        <mat-icon>apartment</mat-icon>
        <span>Turmas</span>
      </a>
      <a routerLink="/alunos" routerLinkActive="active" class="nav-item">
        <mat-icon>schedule</mat-icon>
        <span>Fila de Saída</span>
      </a>
      <a routerLink="/dados-aluno" routerLinkActive="active" class="nav-item">
        <mat-icon>group_outlined</mat-icon>
        <span>Alunos/Responsáveis</span>
      </a>
    </nav>

    <div class="divider"></div>

    <!-- Sair -->
    <div class="nav-bottom">
      <a routerLink="/login" class="nav-item sair">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </a>
    </div>

  </mat-sidenav>

  <!-- Conteúdo principal injetado via router -->
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>
